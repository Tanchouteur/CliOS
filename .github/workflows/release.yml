name: Release ARM64

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  validate-tag:
    needs: quality
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify tag, VERSION, and main ancestry
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }

          version="$(tr -d '[:space:]' < VERSION)"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            fail "tag ${GITHUB_REF_NAME} différent de VERSION (${expected_tag})"
          fi

          if [[ "${GITHUB_REF_TYPE}" != tag ]]; then
            fail "la release doit être déclenchée par un tag Git"
          fi

          commit_sha="${GITHUB_SHA}"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${commit_sha}" refs/remotes/origin/main; then
            fail "le commit ${commit_sha} du tag n'appartient pas à main"
          fi

          python3 -c 'from src.release_contract import SemVer; import pathlib; SemVer.parse(pathlib.Path("VERSION").read_text().strip())'
          echo "Tag ${GITHUB_REF_NAME} validé sur ${commit_sha}"

  build:
    needs: validate-tag
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bookworm-arm64
            image: debian:bookworm
            lock: requirements-bookworm-arm64.lock
          - target: trixie-arm64
            image: debian:trixie
            lock: requirements-trixie-arm64.lock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - id: wheel-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wheelhouses/${{ matrix.target }}
          key: wheelhouse-v2-${{ matrix.target }}-${{ hashFiles(matrix.lock, 'tools/build_wheelhouse.sh') }}
      - name: Build ARM64 wheelhouse
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${GITHUB_WORKSPACE}:/work" -w /work "${{ matrix.image }}" \
            bash -ceu 'apt-get update; apt-get install -y python3 python3-pip python3-venv python3-wheel build-essential libjack-jackd2-dev portaudio19-dev libsndfile1-dev liblo-dev libportmidi-dev; ./tools/build_wheelhouse.sh "${{ matrix.target }}"'
      - name: Verify wheelhouse
        run: python3 tools/verify_wheelhouse.py "${{ matrix.lock }}" "wheelhouses/${{ matrix.target }}"
      - if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: wheelhouses/${{ matrix.target }}
          key: wheelhouse-v2-${{ matrix.target }}-${{ hashFiles(matrix.lock, 'tools/build_wheelhouse.sh') }}
      - name: Build platform assets
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          channel="$(python3 -c 'from src.release_contract import channel_for_version; import pathlib; print(channel_for_version(pathlib.Path("VERSION").read_text().strip()))')"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          python3 tools/build_release.py --output dist --channel "${channel}" --target "${{ matrix.target }}" --base-url "${base}"
          cd dist
          sha256sum --check "SHA256SUMS-${{ matrix.target }}"
          test -f "clios-${version}-${{ matrix.target }}.tar.gz"
          test -f "clios-${version}-${{ matrix.target }}-${channel}.json"
      - name: ARM64 archive self-check
        timeout-minutes: 25
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${GITHUB_WORKSPACE}:/work" -w /work "${{ matrix.image }}" \
            bash -ceu 'apt-get update; apt-get install -y python3 python3-venv libegl1 libgl1 libxkbcommon-x11-0 libglib2.0-0 libfontconfig1 libdbus-1-3 libportaudio2 libportmidi0 libjack-jackd2-0 libsndfile1 liblo7; version=$(tr -d "[:space:]" < VERSION); mkdir /stage; tar -xzf "dist/clios-${version}-${{ matrix.target }}.tar.gz" -C /stage; cd "/stage/clios-${version}"; ./install.sh --venv-only --yes; .venv/bin/pip check; .venv/bin/python -c "import PySide6, numpy, psutil, can, serial, pyudev, bleak, sounddevice, pyo, jsonschema, aifc, audioop"; .venv/bin/python -m compileall -q main.py src tools; .venv/bin/python tools/validate_data.py --all; QT_QPA_PLATFORM=offscreen .venv/bin/python tools/qml_smoke.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/clios-*.tar.gz
            dist/clios-*.json
            dist/SHA256SUMS-*
          if-no-files-found: error

  publish:
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Consolidate and sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_SIGNING_KEY}"
          cat dist/SHA256SUMS-* > dist/SHA256SUMS
          cd dist
          sha256sum --check SHA256SUMS
          umask 077
          printf '%s\n' "${RELEASE_SIGNING_KEY}" > release-private.pem
          openssl pkey -in release-private.pem -pubout -out release-public.pem
          python3 -c 'import json, pathlib; data=json.loads(pathlib.Path("../installation/etc/clios/release-keys.json").read_text()); print(data["keys"][0]["public_key"], end="")' > trusted-public.pem
          cmp release-public.pem trusted-public.pem
          openssl pkeyutl -sign -inkey release-private.pem -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm release-private.pem release-public.pem trusted-public.pem
      - name: Attest archives and manifests
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/clios-*.tar.gz
            dist/clios-*.json
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
      - name: Publish only after both platforms succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          channel="$(python3 -c 'from src.release_contract import channel_for_version; import pathlib; print(channel_for_version(pathlib.Path("VERSION").read_text().strip()))')"
          prerelease=()
          if test "${channel}" = beta; then prerelease=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/clios-*.tar.gz dist/clios-*.json dist/SHA256SUMS dist/SHA256SUMS.sig \
            --verify-tag --generate-notes "${prerelease[@]}"
