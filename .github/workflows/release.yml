name: Release ARM64

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier tag, VERSION et appartenance à main
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          python3 -c 'from src.release_contract import SemVer; import pathlib; SemVer.parse(pathlib.Path("VERSION").read_text().strip())'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install PySide6 jsonschema psutil python-can pyserial

      - name: Portes CI complètes
        run: |
          python -m compileall -q main.py src tools tests
          python tools/validate_data.py --all
          python -m unittest discover -s tests -v
          python tools/qml_smoke.py
          bash -n install.sh update.sh tools/*.sh
          tools/test_install_docker.sh

  build:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bookworm-arm64
            image: debian:bookworm
            lock: requirements-bookworm-arm64.lock
          - target: trixie-arm64
            image: debian:trixie
            lock: requirements-trixie-arm64.lock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Restaurer le wheelhouse en cache
        id: wheel-cache
        uses: actions/cache/restore@v4
        with:
          path: wheelhouses/${{ matrix.target }}
          key: wheelhouse-v1-${{ matrix.target }}-${{ hashFiles(matrix.lock, 'tools/build_wheelhouse.sh') }}

      - name: Construire le wheelhouse ARM64
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${GITHUB_WORKSPACE}:/work" -w /work "${{ matrix.image }}" \
            bash -ceu 'apt-get update; apt-get install -y python3 python3-pip python3-venv python3-wheel build-essential libjack-jackd2-dev portaudio19-dev libsndfile1-dev liblo-dev libportmidi-dev; ./tools/build_wheelhouse.sh "${{ matrix.target }}"'

      - name: Vérifier le wheelhouse
        run: python3 tools/verify_wheelhouse.py "${{ matrix.lock }}" "wheelhouses/${{ matrix.target }}"

      - name: Sauvegarder le wheelhouse vérifié
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: wheelhouses/${{ matrix.target }}
          key: wheelhouse-v1-${{ matrix.target }}-${{ hashFiles(matrix.lock, 'tools/build_wheelhouse.sh') }}

      - name: Construire les assets de plateforme
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          channel="$(python3 -c 'from src.release_contract import channel_for_version; import pathlib; print(channel_for_version(pathlib.Path("VERSION").read_text().strip()))')"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          python3 tools/build_release.py --output dist --channel "${channel}" --target "${{ matrix.target }}" --base-url "${base}"
          cd dist
          sha256sum --check "SHA256SUMS-${{ matrix.target }}"
          test -f "clios-${version}-${{ matrix.target }}.tar.gz"
          test -f "clios-${version}-${{ matrix.target }}-${channel}.json"

      - name: Self-check de l'archive sous ARM64
        shell: bash
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${GITHUB_WORKSPACE}:/work" -w /work "${{ matrix.image }}" \
            bash -ceu 'apt-get update; apt-get install -y python3 python3-venv libegl1 libgl1 libxkbcommon-x11-0 libglib2.0-0 libfontconfig1 libdbus-1-3 libportaudio2 libportmidi0 libjack-jackd2-0 libsndfile1 liblo7; version=$(tr -d "[:space:]" < VERSION); mkdir /stage; tar -xzf "dist/clios-${version}-${{ matrix.target }}.tar.gz" -C /stage; cd "/stage/clios-${version}"; ./install.sh --venv-only --yes; .venv/bin/pip check; .venv/bin/python -c "import PySide6, numpy, psutil, can, serial, pyudev, bleak, sounddevice, pyo, aifc, audioop"; .venv/bin/python -m compileall -q main.py src tools; .venv/bin/python tools/validate_data.py --all; QT_QPA_PLATFORM=offscreen .venv/bin/python tools/qml_smoke.py'

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/clios-*.tar.gz
            dist/clios-*.json
            dist/SHA256SUMS-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Consolider et vérifier SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cat dist/SHA256SUMS-* > dist/SHA256SUMS
          cd dist
          sha256sum --check SHA256SUMS

      - name: Publier seulement après succès des deux plateformes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          channel="$(python3 -c 'from src.release_contract import channel_for_version; import pathlib; print(channel_for_version(pathlib.Path("VERSION").read_text().strip()))')"
          prerelease=()
          if test "${channel}" = beta; then prerelease=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/clios-*.tar.gz \
            dist/clios-*.json \
            dist/SHA256SUMS \
            --verify-tag --generate-notes "${prerelease[@]}"
