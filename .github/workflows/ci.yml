name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_qml_matrix:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test runtime
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 shellcheck
          python -m pip install --upgrade pip
          python -m pip install PySide6 jsonschema psutil python-can pyserial coverage ruff mypy
      - name: Compile Python
        run: python -m compileall -q main.py src tools tests
      - name: Validate JSON and manifests
        run: |
          python tools/validate_data.py --all
          python tools/verify_requirements_alignment.py
      - name: Ruff
        run: ruff check main.py src tools tests
      - name: Mypy progressive scope
        run: mypy src/can_activity.py src/isotp.py src/schema_validation.py src/services/power_management_service.py
      - name: Unit tests with coverage
        run: coverage run -m unittest discover -s tests -v
      - name: Coverage floor
        run: |
          coverage report --fail-under=46
          coverage report --include='src/can_activity.py,src/isotp.py,src/schema_validation.py,src/services/power_management_service.py' --fail-under=90
      - name: QML route smoke test
        run: python tools/qml_smoke.py
      - name: Shell checks
        run: |
          bash -n install.sh update.sh tools/*.sh
          shellcheck -S error install.sh update.sh tools/*.sh

  python-qml:
    name: python-qml
    needs: python_qml_matrix
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - name: Require every supported Python version
        env:
          MATRIX_RESULT: ${{ needs.python_qml_matrix.result }}
        run: test "${MATRIX_RESULT}" = success

  installer:
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer contract (Bookworm and Trixie ARM64)
        run: tools/test_install_docker.sh

  windows-mock:
    timeout-minutes: 35
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: First-time Windows setup
        shell: cmd
        run: clios-windows.cmd -SetupOnly
      - name: Idempotent Windows setup
        shell: cmd
        run: clios-windows.cmd -SetupOnly
      - name: Compile sources and validate data
        shell: cmd
        run: |
          .venv\Scripts\python.exe -m compileall -q main.py src tools tests
          .venv\Scripts\python.exe tools\validate_data.py --all
      - name: Windows architecture, simulation, and QML tests
        shell: cmd
        run: >-
          .venv\Scripts\python.exe -m unittest -v
          tests.test_architecture_contract
          tests.test_launcher_systemd
          tests.test_windows_launcher_contract
          tests.test_simulation_can_encoder
          tests.test_simulation_isotp_obd
          tests.test_simulation_physics
          tests.test_simulation_scenarios
          tests.test_ui_smoothing
          tests.test_ui_structure
          tests.test_ui_style_catalog
      - name: QML route smoke test
        shell: cmd
        run: .venv\Scripts\python.exe tools\qml_smoke.py
      - name: One-click application smoke test
        shell: cmd
        run: clios-windows.cmd -SmokeTest

  dependency-audit:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt

  codeql:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
